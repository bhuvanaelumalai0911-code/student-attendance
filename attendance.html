<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Attendance Management System</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f9;
    color: #222;
}

header {
    background: #243b55;
    color: white;
    padding: 20px;
    text-align: center;
}

.container {
    width: 92%;
    max-width: 1100px;
    margin: 25px auto;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

h2 {
    margin-bottom: 15px;
}

input {
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin: 5px;
}

button {
    padding: 11px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin: 5px;
    color: white;
}

.add-btn {
    background: #2878ff;
}

.present {
    background: #28a745;
}

.absent {
    background: #dc3545;
}

.delete {
    background: #555;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

th {
    background: #243b55;
    color: white;
}

.status {
    font-weight: bold;
}

.summary {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.box {
    flex: 1;
    min-width: 180px;
    padding: 18px;
    background: #eef2f7;
    border-radius: 10px;
    text-align: center;
}

.box h3 {
    font-size: 28px;
    margin-top: 8px;
}

.search {
    width: 95%;
    margin-bottom: 10px;
}

@media(max-width:600px) {
    table {
        font-size: 12px;
    }

    th, td {
        padding: 7px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎓 Student Attendance Management System</h1>
    <p>Manage Student Attendance Easily</p>
</header>

<div class="container">

    <!-- Dashboard -->
    <div class="card">
        <h2>📊 Dashboard</h2>

        <div class="summary">
            <div class="box">
                <p>Total Students</p>
                <h3 id="totalStudents">0</h3>
            </div>

            <div class="box">
                <p>Present Today</p>
                <h3 id="presentCount">0</h3>
            </div>

            <div class="box">
                <p>Absent Today</p>
                <h3 id="absentCount">0</h3>
            </div>
        </div>
    </div>

    <!-- Add Student -->
    <div class="card">
        <h2>➕ Add Student</h2>

        <input type="text" id="rollNo" placeholder="Roll Number">
        <input type="text" id="studentName" placeholder="Student Name">

        <button class="add-btn" onclick="addStudent()">
            Add Student
        </button>
    </div>

    <!-- Attendance -->
    <div class="card">

        <h2>📝 Mark Attendance</h2>

        <input
            class="search"
            type="text"
            id="search"
            placeholder="🔍 Search student..."
            onkeyup="displayStudents()"
        >

        <table>
            <thead>
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Status</th>
                    <th>Attendance %</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>
        </table>

    </div>

</div>

<script>

let students = JSON.parse(localStorage.getItem("students")) || [];


/* Add Student */

function addStudent() {

    let roll = document.getElementById("rollNo").value.trim();
    let name = document.getElementById("studentName").value.trim();

    if (roll === "" || name === "") {
        alert("Please enter Roll Number and Student Name");
        return;
    }

    let existing = students.find(s => s.roll === roll);

    if (existing) {
        alert("Student already exists!");
        return;
    }

    students.push({
        roll: roll,
        name: name,
        present: 0,
        total: 0,
        status: "Not Marked"
    });

    saveData();

    document.getElementById("rollNo").value = "";
    document.getElementById("studentName").value = "";

    displayStudents();
}


/* Mark Attendance */

function markAttendance(index, status) {

    students[index].total++;

    if (status === "Present") {
        students[index].present++;
    }

    students[index].status = status;

    saveData();
    displayStudents();
}


/* Delete Student */

function deleteStudent(index) {

    if (confirm("Delete this student?")) {

        students.splice(index, 1);

        saveData();
        displayStudents();
    }
}


/* Display Students */

function displayStudents() {

    let table = document.getElementById("studentTable");
    let search = document.getElementById("search").value.toLowerCase();

    table.innerHTML = "";

    students.forEach((student, index) => {

        if (
            student.name.toLowerCase().includes(search) ||
            student.roll.toLowerCase().includes(search)
        ) {

            let percentage = student.total === 0
                ? 0
                : ((student.present / student.total) * 100).toFixed(1);

            let row = `
                <tr>

                    <td>${student.roll}</td>

                    <td>${student.name}</td>

                    <td class="status">
                        ${student.status}
                    </td>

                    <td>
                        ${percentage}%
                    </td>

                    <td>

                        <button
                            class="present"
                            onclick="markAttendance(${index}, 'Present')">
                            Present
                        </button>

                        <button
                            class="absent"
                            onclick="markAttendance(${index}, 'Absent')">
                            Absent
                        </button>

                        <button
                            class="delete"
                            onclick="deleteStudent(${index})">
                            Delete
                        </button>

                    </td>

                </tr>
            `;

            table.innerHTML += row;
        }
    });

    updateDashboard();
}


/* Dashboard */

function updateDashboard() {

    document.getElementById("totalStudents").innerText =
        students.length;

    let present = students.filter(
        student => student.status === "Present"
    ).length;

    let absent = students.filter(
        student => student.status === "Absent"
    ).length;

    document.getElementById("presentCount").innerText =
        present;

    document.getElementById("absentCount").innerText =
        absent;
}


/* Save Data */

function saveData() {

    localStorage.setItem(
        "students",
        JSON.stringify(students)
    );
}


/* Load */

displayStudents();

</script>

</body>
</html>
